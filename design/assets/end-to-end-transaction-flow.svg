<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end Wallet and Ledger transaction flow</title>
  <desc id="desc">A client request is deduplicated and committed in Wallet with financial state and an outbox. Local reserve and release complete immediately. Ledger-backed work posts through Kafka, commits a balanced journal and reply outbox, and then finalizes the Wallet transaction.</desc>
  <defs><style>.bg{fill:#f8fafc}.step{fill:#fff;stroke:#475569;stroke-width:2}.wallet{fill:#ecfdf5;stroke:#059669;stroke-width:2}.async{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.ledger{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.local{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.title{font:700 25px system-ui;fill:#0f172a}.h{font:700 17px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.label{font:600 13px system-ui;fill:#334155}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.ab{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#mb)}.ao{stroke:#ea580c;stroke-width:2.2;fill:none;marker-end:url(#mo)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#64748b"/></marker><marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2563eb"/></marker><marker id="mo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#ea580c"/></marker></defs>
  <rect class="bg" width="1240" height="620"/><text class="title" x="40" y="44">Local acceptance first; accounting and final settlement follow asynchronously</text>
  <rect class="step" x="40" y="90" width="190" height="110" rx="12"/><text class="h" x="88" y="125">Client request</text><text class="s" x="68" y="154">atomic / reserve / apply</text><text class="s" x="78" y="178">stable idempotency key</text>
  <rect class="wallet" x="285" y="90" width="245" height="110" rx="12"/><text class="h" x="330" y="125">Wallet processing</text><text class="s" x="315" y="154">validate and deduplicate</text><text class="s" x="314" y="178">normalize persisted actions</text>
  <rect class="wallet" x="590" y="70" width="300" height="150" rx="12"/><text class="h" x="659" y="105">Wallet transaction 1</text><text class="s" x="620" y="135">lock balances / reservations</text><text class="s" x="620" y="160">commit transaction + actions</text><text class="s" x="620" y="185">commit optional command outbox</text>
  <path class="a" d="M230 145h55"/><path class="a" d="M530 145h60"/>
  <rect class="local" x="970" y="70" width="230" height="120" rx="12"/><text class="h" x="1015" y="107">Local completion</text><text class="s" x="1000" y="139">reserve or pure release</text><text class="s" x="1010" y="164">status = COMPLETED</text><path class="ao" d="M890 124h80"/>
  <path class="ab" d="M740 220v70"/><text class="label" x="755" y="258">Ledger-backed: PENDING</text>
  <rect class="async" x="580" y="290" width="320" height="100" rx="12"/><text class="h" x="666" y="326">Command delivery</text><text class="s" x="610" y="356">outbox → Kafka, partitioned by Wallet txn ID</text><text class="s" x="649" y="378">repeated delivery is allowed</text>
  <path class="ab" d="M900 340h70"/>
  <rect class="ledger" x="970" y="275" width="230" height="135" rx="12"/><text class="h" x="1017" y="310">Ledger posting</text><text class="s" x="997" y="339">validate debit = credit</text><text class="s" x="998" y="364">commit journal atomically</text><text class="s" x="998" y="389">persist durable reply</text>
  <path class="ab" d="M1085 410v75H900"/><text class="label" x="955" y="472">Kafka success reply</text>
  <rect class="wallet" x="580" y="450" width="320" height="125" rx="12"/><text class="h" x="658" y="486">Wallet transaction 2</text><text class="s" x="610" y="516">settle reservations and balances</text><text class="s" x="610" y="541">PENDING → COMPLETED atomically</text><path class="a" d="M580 513H345"/>
  <rect class="step" x="65" y="455" width="280" height="120" rx="12"/><text class="h" x="132" y="491">Completed outcome</text><text class="s" x="96" y="522">Wallet state is final for this flow</text><text class="s" x="103" y="548">Ledger journal remains queryable</text>
</svg>
