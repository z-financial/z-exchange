<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">z-exchange core data model relationships</title>
  <desc id="desc">Wallets own balance snapshots. Wallet transactions own actions and may create reservations. Actions target a wallet and can reference a reservation. Ledger transactions correlate to Wallet transactions, own entries, and produce durable replies through an outbox.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.zoneW{fill:#f0fdf4;stroke:#86efac;stroke-width:2}.zoneL{fill:#faf5ff;stroke:#c4b5fd;stroke-width:2}.entity{fill:#fff;stroke:#475569;stroke-width:2}.event{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.title{font:700 25px system-ui;fill:#0f172a}.zoneTitle{font:700 18px system-ui;fill:#334155}.h{font:700 15px system-ui;fill:#0f172a}.f{font:12.5px system-ui;fill:#475569}.label{font:600 12px system-ui;fill:#334155}.small{font:600 11px system-ui;fill:#334155}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}.cross{stroke:#2563eb;stroke-width:2.4;stroke-dasharray:8 5;fill:none;marker-end:url(#mb)}.labelBg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
    </style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#64748b"/></marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2563eb"/></marker>
  </defs>

  <rect class="bg" width="1600" height="850"/>
  <text class="title" x="32" y="42">Business state in Wallet becomes an independently durable accounting journal in Ledger</text>
  <rect class="zoneW" x="20" y="70" width="970" height="710" rx="16"/>
  <text class="zoneTitle" x="48" y="102">Wallet MySQL — mutable business state</text>
  <rect class="zoneL" x="1020" y="70" width="560" height="710" rx="16"/>
  <text class="zoneTitle" x="1048" y="102">Ledger MySQL — append-oriented accounting state</text>

  <!-- Wallet entities -->
  <rect class="entity" x="55" y="165" width="245" height="130" rx="10"/>
  <text class="h" x="78" y="194">wallets</text>
  <text class="f" x="78" y="218">walletId · service/reference</text>
  <text class="f" x="78" y="239">assetId · owner · status</text>
  <text class="f" x="78" y="266">business identity</text>

  <rect class="entity" x="55" y="430" width="245" height="150" rx="10"/>
  <text class="h" x="78" y="459">balance_snapshots</text>
  <text class="f" x="78" y="483">walletId · assetId</text>
  <text class="f" x="78" y="504">available · reserved</text>
  <text class="f" x="78" y="525">version · status</text>
  <text class="f" x="78" y="552">authoritative spendable state</text>

  <rect class="entity" x="390" y="165" width="260" height="150" rx="10"/>
  <text class="h" x="414" y="194">wallet_transactions</text>
  <text class="f" x="414" y="218">txnId · referenceId</text>
  <text class="f" x="414" y="239">initiator · idempotencyKey</text>
  <text class="f" x="414" y="260">type · businessType</text>
  <text class="f" x="414" y="287">PENDING / COMPLETED</text>

  <rect class="entity" x="390" y="430" width="260" height="175" rx="10"/>
  <text class="h" x="414" y="459">wallet_actions</text>
  <text class="f" x="414" y="483">actionId · txnId</text>
  <text class="f" x="414" y="504">walletId · assetId</text>
  <text class="f" x="414" y="525">bucket · actionType · amount</text>
  <text class="f" x="414" y="546">optional reservationId</text>
  <text class="f" x="414" y="578">normalized mutation / audit intent</text>

  <rect class="entity" x="760" y="165" width="205" height="190" rx="10"/>
  <text class="h" x="782" y="194">wallet_reservations</text>
  <text class="f" x="782" y="218">reservationId</text>
  <text class="f" x="782" y="239">walletId · assetId</text>
  <text class="f" x="782" y="260">reserveTxnId</text>
  <text class="f" x="782" y="281">total · remaining</text>
  <text class="f" x="782" y="302">pending · consumed</text>
  <text class="f" x="782" y="323">released · outcome</text>

  <rect class="event" x="390" y="660" width="260" height="90" rx="10"/>
  <text class="h" x="414" y="689">command outbox</text>
  <text class="f" x="414" y="713">command/event + partition key</text>
  <text class="f" x="414" y="734">serialized Ledger posting</text>

  <!-- Wallet relationships, routed through dedicated whitespace -->
  <path class="a" d="M177 295V430"/>
  <rect class="labelBg" x="190" y="350" width="116" height="24" rx="6"/>
  <text class="label" x="201" y="366">1 : 1 by walletId</text>

  <path class="a" d="M520 315V430"/>
  <rect class="labelBg" x="534" y="359" width="74" height="24" rx="6"/>
  <text class="label" x="546" y="375">1 : many</text>

  <path class="a" d="M390 505H344V248H300"/>
  <rect class="labelBg" x="307" y="346" width="76" height="48" rx="6"/>
  <text class="small" x="318" y="365">action targets</text>
  <text class="small" x="318" y="381">wallet + asset</text>

  <path class="a" d="M650 232H760"/>
  <rect class="labelBg" x="666" y="194" width="78" height="48" rx="6"/>
  <text class="small" x="676" y="213">reserve txn</text>
  <text class="small" x="676" y="229">creates hold</text>

  <path class="a" d="M650 520H705V300H760"/>
  <rect class="labelBg" x="662" y="394" width="86" height="48" rx="6"/>
  <text class="small" x="673" y="413">optional</text>
  <text class="small" x="673" y="429">reservationId</text>

  <path class="a" d="M520 605V660"/>
  <rect class="labelBg" x="535" y="614" width="178" height="24" rx="6"/>
  <text class="small" x="546" y="630">emits for Ledger-backed txn</text>

  <!-- Ledger entities -->
  <rect class="entity" x="1080" y="165" width="230" height="140" rx="10"/>
  <text class="h" x="1104" y="194">ledger_transactions</text>
  <text class="f" x="1104" y="218">ledger txnId</text>
  <text class="f" x="1104" y="239">referenceId = Wallet txnId</text>
  <text class="f" x="1104" y="260">metadata · version</text>

  <rect class="entity" x="1080" y="430" width="230" height="150" rx="10"/>
  <text class="h" x="1104" y="459">ledger_entries</text>
  <text class="f" x="1104" y="483">entryId · txnId</text>
  <text class="f" x="1104" y="504">assetId · accountId</text>
  <text class="f" x="1104" y="525">amount · debit/credit</text>
  <text class="f" x="1104" y="552">complete submitted entry set</text>

  <rect class="entity" x="1370" y="430" width="180" height="150" rx="10"/>
  <text class="h" x="1394" y="459">accounts</text>
  <text class="f" x="1394" y="483">accountId</text>
  <text class="f" x="1394" y="504">accountRef</text>
  <text class="f" x="1394" y="525">asset metadata</text>
  <text class="f" x="1394" y="552">posting resolution</text>

  <rect class="event" x="1080" y="660" width="230" height="90" rx="10"/>
  <text class="h" x="1104" y="689">reply outbox</text>
  <text class="f" x="1104" y="713">command correlation</text>
  <text class="f" x="1104" y="734">serialized posting result</text>

  <path class="a" d="M1195 305V430"/>
  <rect class="labelBg" x="1209" y="354" width="74" height="24" rx="6"/>
  <text class="label" x="1221" y="370">1 : many</text>

  <path class="a" d="M1310 505H1370"/>
  <rect class="labelBg" x="1316" y="467" width="50" height="24" rx="6"/>
  <text class="small" x="1323" y="483">resolves</text>

  <path class="a" d="M1195 580V660"/>
  <rect class="labelBg" x="1209" y="608" width="102" height="24" rx="6"/>
  <text class="small" x="1220" y="624">produces reply</text>

  <!-- Cross-service correlation and durable messaging -->
  <path class="cross" d="M520 165V126H1195V165"/>
  <rect class="labelBg" x="735" y="113" width="245" height="26" rx="6"/>
  <text class="label" x="750" y="131">Wallet txnId = Ledger referenceId</text>

  <path class="cross" d="M650 705H1016V235H1080"/>
  <rect class="labelBg" x="745" y="691" width="230" height="26" rx="6"/>
  <text class="label" x="759" y="709">Kafka command → journal append</text>

  <text class="f" x="32" y="821">Lines show application relationships and correlation; they do not imply foreign-key enforcement.</text>
</svg>
