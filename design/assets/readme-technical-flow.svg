<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">z-exchange technical transaction pipeline</title>
  <desc id="desc">A Wallet request passes through Redis coordination, a local Wallet transaction and command outbox, Kafka, Ledger validation and atomic journal posting, a durable reply outbox, and Wallet settlement. Shared infrastructure and observability span the pipeline.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.wallet{fill:#ecfdf5;stroke:#059669;stroke-width:2}.ledger{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.redis{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.db{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.kafka{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.shared{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.title{font:700 25px system-ui;fill:#0f172a}.laneTitle{font:700 16px system-ui;fill:#334155}.h{font:700 15px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.label{font:600 12px system-ui;fill:#334155}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.async{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#mb)}.span{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 5;fill:none}
    </style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#64748b"/></marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1440" height="700"/>
  <text class="title" x="40" y="42">One business request crosses coordination, local atomicity, and duplicate-tolerant delivery</text>

  <rect class="lane" x="28" y="70" width="1384" height="205" rx="14"/>
  <text class="laneTitle" x="48" y="98">Wallet phase 1 — decide and durably accept</text>
  <rect class="wallet" x="50" y="125" width="170" height="105" rx="11"/><text class="h" x="79" y="157">gRPC processor</text><text class="s" x="72" y="182">validate request</text><text class="s" x="72" y="204">normalize actions</text>
  <rect class="redis" x="270" y="125" width="180" height="105" rx="11"/><text class="h" x="305" y="157">Redis idempotency</text><text class="s" x="296" y="182">PENDING claim</text><text class="s" x="296" y="204">hash / replay state</text>
  <rect class="db" x="500" y="112" width="300" height="130" rx="11"/><text class="h" x="577" y="143">Wallet MySQL TX 1</text><text class="s" x="529" y="169">lock + guard balance snapshots</text><text class="s" x="529" y="191">update reservations and actions</text><text class="s" x="529" y="213">insert transaction + command outbox</text>
  <rect class="kafka" x="850" y="125" width="190" height="105" rx="11"/><text class="h" x="893" y="157">Command outbox</text><text class="s" x="883" y="182">immediate publish</text><text class="s" x="883" y="204">scheduled retry</text>
  <rect class="kafka" x="1090" y="125" width="270" height="105" rx="11"/><text class="h" x="1160" y="157">Kafka command</text><text class="s" x="1127" y="182">transaction partition key</text><text class="s" x="1127" y="204">retry topics / DLT hooks</text>
  <path class="a" d="M220 177h50"/><path class="a" d="M450 177h50"/><path class="a" d="M800 177h50"/><path class="async" d="M1040 177h50"/>

  <rect class="lane" x="28" y="295" width="1384" height="205" rx="14"/>
  <text class="laneTitle" x="48" y="323">Ledger posting and Wallet phase 2 — account, reply, and settle</text>
  <rect class="ledger" x="1090" y="350" width="270" height="105" rx="11"/><text class="h" x="1150" y="382">Ledger processor</text><text class="s" x="1122" y="407">deduplicate + resolve accounts</text><text class="s" x="1122" y="429">balance debit / credit per asset</text>
  <rect class="db" x="800" y="337" width="240" height="130" rx="11"/><text class="h" x="852" y="368">Ledger MySQL</text><text class="s" x="827" y="394">atomic header + entries</text><text class="s" x="827" y="416">unique business reference</text><text class="s" x="827" y="438">durable reply outbox</text>
  <rect class="kafka" x="560" y="350" width="190" height="105" rx="11"/><text class="h" x="609" y="382">Kafka reply</text><text class="s" x="589" y="407">delivery may repeat</text><text class="s" x="589" y="429">same correlation ID</text>
  <rect class="wallet" x="320" y="350" width="190" height="105" rx="11"/><text class="h" x="361" y="382">Reply listener</text><text class="s" x="347" y="407">load stored actions</text><text class="s" x="347" y="429">guard current state</text>
  <rect class="db" x="50" y="337" width="220" height="130" rx="11"/><text class="h" x="88" y="368">Wallet MySQL TX 2</text><text class="s" x="76" y="394">settle reservations</text><text class="s" x="76" y="416">apply outgoing / incoming</text><text class="s" x="76" y="438">PENDING → COMPLETED</text>
  <path class="async" d="M1225 230v120"/><path class="a" d="M1090 402h-50"/><path class="async" d="M800 402h-50"/><path class="async" d="M560 402h-50"/><path class="a" d="M320 402h-50"/>

  <rect class="shared" x="50" y="540" width="850" height="105" rx="12"/><text class="h" x="76" y="572">common-util reliability mechanisms</text><text class="s" x="76" y="598">Result-aware transactions · Redis Lua coordination · cache strategies · outbox publisher/dispatcher · manual-ack listeners</text><text class="s" x="76" y="621">Application code owns financial meaning; shared infrastructure supplies reusable atomicity, delivery, and fallback mechanisms.</text>
  <rect class="shared" x="950" y="540" width="410" height="105" rx="12"/><text class="h" x="976" y="572">Layered observability</text><text class="s" x="976" y="598">business outcomes · gRPC · Kafka · outbox age</text><text class="s" x="976" y="621">Redis/cache · SQL/TX · Hikari · JVM/process</text>
  <path class="span" d="M475 500v40"/><path class="span" d="M1155 500v40"/>
</svg>
