<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
  <title id="title">z-exchange system architecture</title>
  <desc id="desc">Clients call Wallet Service, which owns balances, reservations, and transaction decisions. Wallet and Ledger exchange durable commands and replies through Kafka outboxes. Ledger owns the balanced accounting journal. Each service has its own MySQL database and uses shared Redis and infrastructure mechanisms.</desc>
  <defs>
    <style>.bg{fill:#f8fafc}.client{fill:#fff;stroke:#475569;stroke-width:2}.wallet{fill:#ecfdf5;stroke:#059669;stroke-width:2}.ledger{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.infra{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.db{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.shared{fill:#f1f5f9;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}.title{font:700 25px system-ui;fill:#0f172a}.h{font:700 18px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.label{font:600 13px system-ui;fill:#334155}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.ab{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#mb)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none}</style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#64748b"/></marker><marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1240" height="560"/><text class="title" x="40" y="45">Two financial boundaries connected by durable, asynchronous messaging</text>
  <rect class="client" x="40" y="190" width="150" height="100" rx="12"/><text class="h" x="78" y="228">Clients</text><text class="s" x="63" y="257">Wallet APIs</text>
  <rect class="wallet" x="260" y="120" width="300" height="240" rx="14"/><text class="h" x="345" y="157">Wallet Service</text><text class="s" x="292" y="193">transaction decisions and lifecycle</text><text class="s" x="292" y="222">available / reserved balances</text><text class="s" x="292" y="251">reservation state</text><text class="s" x="292" y="280">client idempotency</text><text class="s" x="292" y="309">command outbox + reply finalization</text>
  <rect class="infra" x="650" y="155" width="220" height="170" rx="14"/><text class="h" x="727" y="192">Kafka</text><text class="s" x="692" y="225">posting commands →</text><text class="s" x="692" y="255">← posting replies</text><text class="s" x="684" y="291">delivery may repeat</text>
  <rect class="ledger" x="950" y="120" width="250" height="240" rx="14"/><text class="h" x="1008" y="157">Ledger Service</text><text class="s" x="984" y="193">passive accounting journal</text><text class="s" x="984" y="222">per-asset debit = credit</text><text class="s" x="984" y="251">posting idempotency</text><text class="s" x="984" y="280">transaction queries</text><text class="s" x="984" y="309">durable reply outbox</text>
  <rect class="db" x="280" y="420" width="260" height="95" rx="12"/><text class="h" x="350" y="455">Wallet MySQL</text><text class="s" x="310" y="484">business truth + command outbox</text>
  <rect class="db" x="945" y="420" width="260" height="95" rx="12"/><text class="h" x="1019" y="455">Ledger MySQL</text><text class="s" x="978" y="484">journal truth + reply outbox</text>
  <rect class="shared" x="625" y="420" width="270" height="95" rx="12"/><text class="h" x="702" y="455">Shared Redis</text><text class="s" x="659" y="484">coordination and read acceleration</text>
  <path class="a" d="M190 240h70"/><text class="label" x="206" y="226">gRPC</text><path class="ab" d="M560 210h90"/><path class="ab" d="M650 274h-90"/><path class="ab" d="M870 210h80"/><path class="ab" d="M950 274h-80"/>
  <path class="a" d="M410 360v60"/><path class="a" d="M1075 360v60"/><path class="dash" d="M540 468h85"/><path class="dash" d="M895 468h50"/>
</svg>
