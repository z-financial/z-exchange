<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
 <title id="title">Wallet two-bucket balance lifecycle</title><desc id="desc">Funds move between available and reserved before Ledger, then transfer out or in after Ledger succeeds.</desc>
 <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.t{font:600 17px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}.g{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#g)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#059669"/></marker></defs>
 <rect class="bg" width="1080" height="390"/><text class="t" x="40" y="42" font-size="22">Two buckets separate spendable funds from funds committed to in-flight work</text>
 <rect class="b" x="70" y="105" width="250" height="120"/><text class="t" x="95" y="140">AVAILABLE</text><text class="s" x="95" y="170">spendable balance</text><text class="s" x="95" y="194">credit enters here</text>
 <rect class="p" x="415" y="105" width="250" height="120"/><text class="t" x="440" y="140">RESERVED</text><text class="s" x="440" y="170">held / pending settlement</text><text class="s" x="440" y="194">not spendable again</text>
 <rect class="b" x="760" y="105" width="250" height="120"/><text class="t" x="785" y="140">SETTLED OUT</text><text class="s" x="785" y="170">removed after Ledger success</text><text class="s" x="785" y="194">transfer-in enters AVAILABLE</text>
 <path class="g" d="M320 145h95"/><text class="s" x="343" y="132">reserve</text><path class="a" d="M415 195h-95"/><text class="s" x="340" y="218">release</text><path class="g" d="M665 165h95"/><text class="s" x="685" y="150">transfer-out</text>
 <rect class="b" x="250" y="290" width="580" height="65"/><text class="t" x="275" y="319">Each phase: lock snapshot rows by primary key → validate → guarded update → commit</text><text class="s" x="275" y="341">Cache maintenance follows successful commit and is best effort.</text>
</svg>
