<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="420" viewBox="0 0 1110 420" role="img" aria-labelledby="title desc">
 <title id="title">Wallet layered idempotency decision flow</title><desc id="desc">A validated request claims Redis, checks authoritative MySQL, commits one transaction, and marks Redis accepted.</desc>
 <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:12}.r{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.d{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.t{font:600 16px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
 <rect class="bg" width="1110" height="420"/><text class="t" x="40" y="42" font-size="22">Redis coordinates the hot path; MySQL prevents duplicate committed Wallet transactions</text>
 <rect class="b" x="45" y="105" width="185" height="105"/><text class="t" x="65" y="137">Validate + hash</text><text class="s" x="65" y="164">stable business request</text><text class="s" x="65" y="186">line order normalized</text>
 <rect class="r" x="275" y="85" width="210" height="145"/><text class="t" x="295" y="117">Redis coordination</text><text class="s" x="295" y="144">claim one PENDING owner</text><text class="s" x="295" y="166">publish visible state</text><text class="s" x="295" y="188">ACCEPTED → replay ID</text><text class="s" x="295" y="210">stable request identity</text>
 <rect class="d" x="550" y="85" width="220" height="145"/><text class="t" x="570" y="117">MySQL authority</text><text class="s" x="570" y="144">lookup initiator + key</text><text class="s" x="570" y="166">unique committed txn</text><text class="s" x="570" y="188">multi-table rollback</text><text class="s" x="570" y="210">on losing insert</text>
 <rect class="g" x="835" y="105" width="220" height="105"/><text class="t" x="855" y="137">Accepted result</text><text class="s" x="855" y="164">same Wallet txn ID</text><text class="s" x="855" y="186">best-effort Redis mark</text>
 <path class="a" d="M230 157h45"/><path class="a" d="M485 157h65"/><path class="a" d="M770 157h65"/>
 <rect class="b" x="275" y="295" width="495" height="75"/><text class="t" x="295" y="327">Durable replay</text><text class="s" x="295" y="350">MySQL identity can repopulate Redis and return the accepted transaction ID</text><path class="a" d="M660 230v65"/><path class="a" d="M770 332h65v-122"/>
</svg>
