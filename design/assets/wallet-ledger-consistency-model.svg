<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" role="img" aria-labelledby="title desc">
  <title id="title">Wallet and Ledger cross-service consistency model</title>
  <desc id="desc">Three local durability boundaries form the cross-service flow: Wallet acceptance with command outbox, Ledger journal append with a durable reply action, and Wallet finalization. Stable identities and guarded state transitions make repeated delivery safe at the effect level.</desc>
  <defs><style>.bg{fill:#f8fafc}.boundary{fill:#fff;stroke:#475569;stroke-width:2}.wallet{fill:#ecfdf5;stroke:#059669;stroke-width:2}.ledger{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.async{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.guard{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.title{font:700 25px system-ui;fill:#0f172a}.h{font:700 17px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.label{font:600 13px system-ui;fill:#334155}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.ab{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#mb)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#64748b"/></marker><marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2563eb"/></marker></defs>
  <rect class="bg" width="1240" height="530"/><text class="title" x="40" y="44">Cross-service consistency comes from local commits plus repeat-safe transitions</text>
  <rect class="wallet" x="45" y="105" width="320" height="185" rx="14"/><text class="h" x="104" y="140">1. Wallet acceptance commit</text><text class="s" x="76" y="174">balances + reservations</text><text class="s" x="76" y="202">transaction + actions</text><text class="s" x="76" y="230">command outbox</text><text class="s" x="76" y="258">status = PENDING</text>
  <rect class="async" x="410" y="145" width="170" height="105" rx="12"/><text class="h" x="452" y="180">Kafka</text><text class="s" x="425" y="208">delivery may repeat</text><text class="s" x="428" y="232">stable identity</text>
  <rect class="ledger" x="625" y="105" width="320" height="185" rx="14"/><text class="h" x="686" y="140">2. Ledger durable work</text><text class="s" x="656" y="174">balanced journal commit</text><text class="s" x="656" y="202">unique Wallet transaction reference</text><text class="s" x="656" y="230">durable reply action</text><text class="s" x="656" y="258">source acknowledgment follows</text>
  <rect class="async" x="990" y="145" width="170" height="105" rx="12"/><text class="h" x="1032" y="180">Kafka</text><text class="s" x="1005" y="208">delivery may repeat</text><text class="s" x="1008" y="232">stable identity</text>
  <path class="ab" d="M365 198h45"/><path class="ab" d="M580 198h45"/><path class="ab" d="M945 198h45"/>
  <path class="ab" d="M1075 250v92H895"/>
  <rect class="wallet" x="575" y="330" width="320" height="150" rx="14"/><text class="h" x="626" y="366">3. Wallet finalization commit</text><text class="s" x="607" y="400">settle balances + reservations</text><text class="s" x="607" y="428">guard PENDING → COMPLETED</text><text class="s" x="607" y="456">acknowledge reply afterward</text>
  <rect class="guard" x="45" y="350" width="430" height="115" rx="12"/><text class="h" x="85" y="385">Repeat-safety across every boundary</text><text class="s" x="76" y="417">Redis coordinates live attempts; MySQL unique keys and</text><text class="s" x="76" y="443">guarded state transitions protect durable business effects.</text>
  <path class="a" d="M475 408h100"/>
</svg>
