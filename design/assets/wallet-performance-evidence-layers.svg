<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="430" viewBox="0 0 1130 430" role="img" aria-labelledby="title desc">
 <title id="title">Wallet performance evidence layers</title><desc id="desc">Workload, service, data and settlement measurements combine with database reconciliation to evaluate Wallet performance and correctness.</desc>
 <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:12}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.t{font:600 16px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
 <rect class="bg" width="1130" height="430"/><text class="t" x="40" y="42" font-size="22">A Wallet run is useful only when load, settlement, resources, and correctness align</text>
 <rect class="b" x="35" y="95" width="190" height="125"/><text class="t" x="55" y="127">k6 workload</text><text class="s" x="55" y="153">write/query modes</text><text class="s" x="55" y="176">rate + duplicates</text><text class="s" x="55" y="199">latency + outcomes</text>
 <rect class="p" x="270" y="95" width="195" height="125"/><text class="t" x="290" y="127">Wallet ingress</text><text class="s" x="290" y="153">gRPC acceptance</text><text class="s" x="290" y="176">query processing</text><text class="s" x="290" y="199">business errors</text>
 <rect class="p" x="510" y="95" width="195" height="125"/><text class="t" x="530" y="127">Settlement</text><text class="s" x="530" y="153">outbox + Kafka</text><text class="s" x="530" y="176">Ledger posting</text><text class="s" x="530" y="199">Wallet completion</text>
 <rect class="b" x="750" y="95" width="195" height="125"/><text class="t" x="770" y="127">Data/runtime</text><text class="s" x="770" y="153">SQL + Hikari</text><text class="s" x="770" y="176">Redis + JVM</text><text class="s" x="770" y="199">CPU / memory</text>
 <path class="a" d="M225 157h45"/><path class="a" d="M465 157h45"/><path class="a" d="M705 157h45"/>
 <rect class="g" x="270" y="285" width="675" height="95"/><text class="t" x="292" y="317">Post-run settlement and SQL reconciliation</text><text class="s" x="292" y="343">pending/duplicates • balance conservation • reservation partition • action/outbox shape</text><text class="s" x="292" y="365">exact snapshots • one balanced Ledger posting for each Ledger-backed command</text>
 <path class="a" d="M608 220v65"/>
</svg>
