<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
 <title id="title">Wallet reservation amount-state lifecycle</title><desc id="desc">A reservation starts remaining, may move to pending settlement or released, and pending settlement becomes consumed after Ledger success.</desc>
 <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:12}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.f{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.t{font:600 16px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs>
 <rect class="bg" width="1120" height="420"/><text class="t" x="40" y="42" font-size="22">Reservation amounts form a conserved partition of the original hold</text>
 <rect class="b" x="50" y="105" width="220" height="105"/><text class="t" x="72" y="138">REMAINING</text><text class="s" x="72" y="165">available within this hold</text><text class="s" x="72" y="187">ACTIVE / NOT_DONE</text>
 <rect class="p" x="360" y="80" width="240" height="105"/><text class="t" x="382" y="113">PENDING_SETTLE</text><text class="s" x="382" y="140">earmarked for accounting</text><text class="s" x="382" y="162">awaits Ledger success</text>
 <rect class="f" x="700" y="80" width="180" height="105"/><text class="t" x="722" y="113">CONSUMED</text><text class="s" x="722" y="140">settled after Ledger</text><text class="s" x="722" y="162">success</text>
 <rect class="f" x="360" y="255" width="240" height="105"/><text class="t" x="382" y="288">RELEASED</text><text class="s" x="382" y="315">returned synchronously</text><text class="s" x="382" y="337">to available balance</text>
 <path class="a" d="M270 135h90"/><text class="s" x="289" y="121">consume</text><path class="a" d="M600 132h100"/><text class="s" x="622" y="118">Ledger success</text><path class="a" d="M245 210l115 75"/><text class="s" x="267" y="263">release</text>
 <rect class="b" x="700" y="255" width="350" height="105"/><text class="t" x="722" y="288">FINISHED outcome</text><text class="s" x="722" y="315">CONSUMED, RELEASED, or PARTIAL</text><text class="s" x="722" y="337">when consumed + released = total</text><path class="a" d="M600 307h100"/>
</svg>
