<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Wallet Service architecture and responsibility boundaries</title>
  <desc id="desc">Clients call Wallet Service, which owns financial business state in MySQL, uses Redis for idempotency and cache acceleration, and exchanges durable commands and replies with Ledger Service through Kafka and outboxes.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.wallet{fill:#ecfdf5;stroke:#059669;stroke-width:2}.store{fill:#fff;stroke:#475569;stroke-width:2}.async{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.ledger{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.title{font:700 24px system-ui;fill:#0f172a}.h{font:700 17px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.label{font:600 13px system-ui;fill:#334155}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.ab{stroke:#2563eb;stroke-width:2.2;fill:none;marker-end:url(#blue)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1200" height="500"/>
  <text class="title" x="40" y="45">Wallet owns financial business state; Ledger owns the accounting journal</text>

  <rect class="store" x="40" y="175" width="150" height="100" rx="12"/>
  <text class="h" x="78" y="210">Clients</text>
  <text class="s" x="59" y="237">transaction APIs</text>
  <text class="s" x="73" y="260">balance reads</text>

  <rect class="wallet" x="270" y="120" width="300" height="210" rx="14"/>
  <text class="h" x="360" y="155">Wallet Service</text>
  <text class="s" x="300" y="188">transaction decisions and lifecycle</text>
  <text class="s" x="300" y="216">available / reserved balances</text>
  <text class="s" x="300" y="244">reservation amount state</text>
  <text class="s" x="300" y="272">locking, validation, idempotency</text>
  <text class="s" x="300" y="300">command and reply processing</text>

  <rect class="store" x="650" y="70" width="235" height="120" rx="12"/>
  <text class="h" x="718" y="104">Redis</text>
  <text class="s" x="681" y="135">idempotency coordination</text>
  <text class="s" x="697" y="161">balance read cache</text>

  <rect class="store" x="650" y="260" width="235" height="160" rx="12"/>
  <text class="h" x="702" y="294">Wallet MySQL</text>
  <text class="s" x="681" y="325">balances + reservations</text>
  <text class="s" x="681" y="352">transactions + actions</text>
  <text class="s" x="681" y="379">durable command outbox</text>
  <text class="s" x="681" y="403">authoritative state</text>

  <rect class="async" x="955" y="112" width="205" height="105" rx="12"/>
  <text class="h" x="1017" y="147">Kafka</text>
  <text class="s" x="986" y="176">commands and replies</text>
  <text class="s" x="998" y="199">delivery may repeat</text>

  <rect class="ledger" x="955" y="300" width="205" height="105" rx="12"/>
  <text class="h" x="995" y="335">Ledger Service</text>
  <text class="s" x="982" y="365">balanced journal append</text>
  <text class="s" x="1000" y="388">durable reply outbox</text>

  <path class="a" d="M190 225h80"/><text class="label" x="205" y="211">gRPC</text>
  <path class="dash" d="M570 170h80"/><path class="dash" d="M650 130h-80"/>
  <path class="a" d="M570 298h80"/><path class="a" d="M650 365h-80"/>
  <path class="ab" d="M885 330c44 0 30-166 70-166"/><text class="label" x="866" y="238">outbox</text>
  <path class="ab" d="M1057 217v83"/><path class="ab" d="M1028 300v-83"/>
</svg>
