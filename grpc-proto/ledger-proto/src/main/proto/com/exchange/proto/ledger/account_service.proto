syntax = "proto3";

package ledger;

option java_multiple_files = true;
option java_package = "com.exchange.proto.ledger.account";

import "com/exchange/proto/ledger/ledger_common.proto";
import "com/exchange/proto/common/error.proto";

service AccountService {
  rpc createAccount(CreateAccountRequestPb) returns (CreateAccountReplyPb) {}
}

message CreateAccountRequestPb {
  string source_account_ref = 1;
  ServiceIdPb source_service_id = 2;
  string asset_id = 3;
  AccountCategoryPb category = 4;
  NormalSidePb normal_side = 5;
  OwnerTypePb owner_type = 6;
  string owner_id = 7;
}

message CreateAccountReplyPb {
  common.ErrorPb error = 1;
  string ledger_account_ref = 2;
}
