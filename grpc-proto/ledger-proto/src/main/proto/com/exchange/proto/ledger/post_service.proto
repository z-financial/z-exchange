syntax = "proto3";

package ledger;

option java_multiple_files = true;
option java_package = "com.exchange.proto.ledger.post";

import "com/exchange/proto/ledger/ledger_common.proto";
import "com/exchange/proto/common/error.proto";

service PostService {
  rpc postTransaction(PostTransactionRequestPb) returns (PostTransactionReplyPb) {}
  rpc getTxnByLedgerTxnRef(GetTxnByLedgerTxnRefRequestPb) returns (GetTxnReplyPb);
  rpc getTxnBySourceTxnRef(GetTxnBySourceTxnRefRequestPb) returns (GetTxnReplyPb);
}

message PostTransactionRequestPb {
  string source_txn_ref = 1;
  string description = 2;
  repeated LedgerEntryPb entries = 3;
}

message PostTransactionReplyPb {
  string source_txn_ref = 1;
  string ledger_txn_ref = 2;
  common.ErrorPb error = 3;
}

message GetTxnByLedgerTxnRefRequestPb {
  string ledger_txn_ref = 1;
  bool include_entries = 2;
}

message GetTxnBySourceTxnRefRequestPb {
  string source_txn_ref = 1;
  bool include_entries = 2;
}

message GetTxnReplyPb {
  LedgerTransactionPb transaction = 1;
  repeated LedgerEntryPb entries = 2; // present when includeEntries=true and txn found
  common.ErrorPb error = 3;
}

message LedgerTransactionPb {
  string ledger_txn_ref = 1;
  string source_txn_ref = 2;
  string extra_data = 3;
}

message LedgerEntryPb {
  string ledger_entry_ref = 1;
  string ledger_account_ref = 2;
  LedgerDirectionPb direction = 3;
  int64 amount = 4;
  string asset_id = 5;
}
