syntax = "proto3";

package wallet;

option java_multiple_files = true;
option java_package = "com.exchange.proto.wallet.wallet";

import "wallet/wallet_enum.proto";
import "com/exchange/proto/common/error.proto";

message GetSnapshotByWalletRefRequestPb {
  string wallet_ref = 1;
}

message GetSnapshotByBusinessRefRequestPb {
  string wallet_business_ref = 1;
  ServiceIdPb service_id = 2;
}

message GetSnapshotReplyPb {
  BalanceSnapshotPb transaction = 1;
  common.ErrorPb error = 2;
}

message BalanceSnapshotPb {
  string wallet_ref = 1;
  ServiceIdPb service_id = 2;
  string wallet_business_ref = 3;
  string asset_id = 4;
  WalletStatusPb wallet_status = 5;
  OwnerTypePb owner_type = 6;
  string owner_id = 7;
  int64 available = 8;
  int64 reserved = 9;
}
