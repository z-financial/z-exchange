syntax = "proto3";

package wallet;

option java_multiple_files = true;
option java_package = "com.exchange.proto.wallet.wallet";

import "wallet/wallet_enum.proto";
import "com/exchange/proto/common/error.proto";

message CreateWalletRequestPb {
  ServiceIdPb service_id = 1;
  string wallet_business_ref = 2;
  string asset_id = 3;
  OwnerTypePb owner_type = 4;
  string owner_id = 5;
}

message CreateWalletReplyPb {
  common.ErrorPb error = 1;
  string wallet_ref = 2;
}
