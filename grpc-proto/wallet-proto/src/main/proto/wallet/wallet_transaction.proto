syntax = "proto3";

package wallet;

option java_multiple_files = true;
option java_package = "com.exchange.proto.wallet.wallet";

import "wallet/wallet_enum.proto";
import "com/exchange/proto/common/error.proto";

message AtomicTransactionRequestPb {
  string wallet_txn_business_ref = 1;
  ServiceIdPb initiator = 2;
  BusinessTypePb business_type = 3;
  repeated TransactionLinePb lines = 4;
}

message AtomicTransactionReplyPb {
  common.ErrorPb error = 1;
  string wallet_txn_ref = 2;
  TransactionStatusPb status = 3;
}

message ReserveTransactionRequestPb {
  string wallet_txn_business_ref = 1;
  ServiceIdPb initiator = 2;
  BusinessTypePb business_type = 3;
  repeated TransactionLinePb lines = 4;
}

message ReserveTransactionReplyPb {
  common.ErrorPb error = 1;
  string wallet_txn_ref = 2;
  TransactionStatusPb status = 3;
  repeated ReservationInfoPb infos = 4;
}

message TwoStepTransactionRequestPb {
  string wallet_txn_business_ref = 1;
  ServiceIdPb initiator = 2;
  BusinessTypePb business_type = 3;
  repeated TransactionLinePb lines = 4;
}

message TwoStepTransactionReplyPb {
  common.ErrorPb error = 1;
  string wallet_txn_ref = 2;
  TransactionStatusPb status = 3;
}

message ApplyReservationTransactionRequestPb   {
  string wallet_txn_business_ref = 1;
  ServiceIdPb initiator = 2;
  BusinessTypePb business_type = 3;
  repeated TransactionLinePb lines = 4;
}

message ApplyReservationTransactionReplyPb {
  common.ErrorPb error = 1;
  string wallet_txn_ref = 2;
  TransactionStatusPb status = 3;
}

message TransactionLinePb {
  string wallet_ref = 1;
  string asset_code = 2;
  OperationTypePb operation_type = 3;
  int64 amount = 4;
  string reservation_ref = 5; // used in 2-step transaction, when action_type=consume/release
}

message ReservationInfoPb {
  string reservation_ref = 1;
  string wallet_ref = 2;
  string asset_code = 3;
  int64 amount = 4;
}
