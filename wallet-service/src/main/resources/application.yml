spring:
  application:
    name: wallet-service

  profiles:
    default: cloud

  datasource:
    url: "jdbc:mysql://localhost:3306/trade_walletservice?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false"
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Ledger and wallet share a MySQL max_connections budget of 80. Their caps of 32 each
    # leave 16 connections for operations and auxiliary clients in a single-instance deployment.
    hikari:
      maximum-pool-size: ${WALLET_DB_MAX_POOL_SIZE:32}
      minimum-idle: ${WALLET_DB_MIN_IDLE:16}
      connection-timeout: ${WALLET_DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${WALLET_DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${WALLET_DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${WALLET_DB_KEEPALIVE_TIME_MS:300000}
      # Driver timeouts bound connection establishment and socket reads independently of
      # Hikari's pool-acquisition timeout.
      data-source-properties:
        connectTimeout: ${WALLET_DB_CONNECT_TIMEOUT_MS:2000}
        socketTimeout: ${WALLET_DB_SOCKET_TIMEOUT_MS:5000}

  cache:
    type: redis
  redis:
    port: 6379

  kafka:
    consumer:
      auto-offset-reset: latest
      fetch-min-size: 256
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

    listener:
      ack-mode: manual
      type: single

    producer:
      compression-type: lz4
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

      properties:
        enable:
          idempotence: true


server:
  port: 8082


grpc:
  server:
    port: 9192

  client:
    GLOBAL:
      enable-keep-alive: true
      negotiation-type: plaintext

    ledger-client:
      address: static://127.0.0.1:9191

    account-client:
      address: static://127.0.0.1:9191

mybatis-plus:
  configuration:
    # Bound mapper execution so a slow statement cannot retain a shared DB connection indefinitely.
    default-statement-timeout: ${WALLET_DB_STATEMENT_TIMEOUT_SECONDS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        zexchange.grpc.server.duration: true
        zexchange.wallet.processing.duration: true
        zexchange.kafka.listener.duration: true
        zexchange.kafka.listener.processing.delay: true
        zexchange.kafka.publisher.duration: true
        zexchange.outbox.delivery.delay: true
        zexchange.redis.operation.duration: true
        zexchange.db.operation.duration: true
        zexchange.db.transaction.duration: true
      slo:
        zexchange.grpc.server.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.wallet.processing.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.kafka.listener.duration: 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s
        zexchange.kafka.listener.processing.delay: 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s,30s,1m
        zexchange.kafka.publisher.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.outbox.delivery.delay: 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s,30s,1m,5m
        zexchange.redis.operation.duration: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
        zexchange.db.operation.duration: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.db.transaction.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s

app:
  id-generator:
    # ID-creating writes fail at startup when the managed runtime is unavailable.
    enabled: ${ID_GENERATOR_ENABLED:true}
    domain-name: ${ID_GENERATOR_DOMAIN:z-exchange-wallet}
    generator-name: ${ID_GENERATOR_NAME:internal-id}
    # Must be <= 27 characters; the lease layer appends a UUID owner token.
    server-instance-id: ${ID_GENERATOR_INSTANCE_ID:wallet}
    default-statement-timeout-seconds: ${ID_GENERATOR_DB_STATEMENT_TIMEOUT_SECONDS:5}
    lease-request-timeout-seconds: ${ID_GENERATOR_LEASE_TIMEOUT_SECONDS:2}
    data-source:
      jdbc-url: ${ID_GENERATOR_DB_URL:jdbc:mysql://localhost:3306/z_id_generator?serverTimezone=UTC&characterEncoding=utf-8&useSSL=false}
      username: ${ID_GENERATOR_DB_USERNAME:zid_runtime}
      password: ${ID_GENERATOR_DB_PASSWORD:zid-local}
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: ${ID_GENERATOR_DB_MAX_POOL_SIZE:4}
      minimum-idle: ${ID_GENERATOR_DB_MIN_IDLE:1}
      connection-timeout-millis: ${ID_GENERATOR_DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout-millis: ${ID_GENERATOR_DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime-millis: ${ID_GENERATOR_DB_MAX_LIFETIME_MS:1500000}
      keepalive-time-millis: ${ID_GENERATOR_DB_KEEPALIVE_TIME_MS:300000}
    runtime:
      lease-term-seconds: ${ID_GENERATOR_LEASE_TERM_SECONDS:10}
      local-safe-term-millis: ${ID_GENERATOR_LOCAL_SAFE_TERM_MS:8000}
      clock-skew-window-millis: ${ID_GENERATOR_CLOCK_SKEW_WINDOW_MS:1000}
      reuse-safety-margin-millis: ${ID_GENERATOR_REUSE_SAFETY_MARGIN_MS:100}
      renew-interval-millis: ${ID_GENERATOR_RENEW_INTERVAL_MS:5000}
      cleaner-interval-millis: ${ID_GENERATOR_CLEANER_INTERVAL_MS:1000}
      renew-core-pool-size: ${ID_GENERATOR_RENEW_CORE_POOL_SIZE:2}
      renew-max-pool-size: ${ID_GENERATOR_RENEW_MAX_POOL_SIZE:4}
      renew-queue-size: ${ID_GENERATOR_RENEW_QUEUE_SIZE:1024}
      ownership-check-interval-millis: ${ID_GENERATOR_OWNERSHIP_CHECK_INTERVAL_MS:1000}

  kafka:
    not-retriable-exceptions: com.exchange.common.exception.AbnormalProtoDataException
    listener:
      retry:
        attempts: 7
        backoff-delay-ms: 1000
        backoff-multiplier: 1.0
        backoff-max-delay-ms: 25000
        auto-create-topics: false

  outbox:
    interval: "*/5 * * * * ?"
    page-limit: 2

  cache:
    idemp:
      pending-ttl: 120s
      done-ttl: 24h
      jitter-ms: 100
    data:
      entity-cache-ttl: 120s
      index-cache-ttl: 1h
      tombstone-ttl: 120s # should be short to only cover request ttl
      negative-ttl: 30s
      jitter: 100ms
